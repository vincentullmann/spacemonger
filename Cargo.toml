[package]
name = "spacemonger"
version = "0.1.0"
edition = "2021"
description = "SpaceMonger One - treemap disk space viewer (Rust port)"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
rayon = "1.12"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5.2"
open = "5.4"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
num-format = "0.4"
humansize = "2.1"
serde = { version = "1", features = ["derive"] }
indexmap = "2"
dashmap = "6"
poll-promise = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
