[package]
name = "spacemonger"
version = "0.1.0"
edition = "2021"
description = "SpaceMonger One - treemap disk space viewer (Rust port)"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
rayon = "1.12"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5.2"
open = "5.4"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
