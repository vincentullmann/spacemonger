[package]
name = "spacemonger"
version = "0.1.0"
edition = "2021"
description = "SpaceMonger One - treemap disk space viewer (Rust port)"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11", "persistence"] }
rayon = "1.12"
trash = "5.2"
open = "5.4"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
num-format = "0.4"
humansize = "2.1"
serde = { version = "1", features = ["derive"] }
indexmap = "2"
dashmap = "6"
poll-promise = "0.3"
filesize = "0.2"
thiserror = "2"
lfs-core = "0.20"
kurbo = "0.13.1"
colorgrad = { version = "0.9", default-features = false, features = ["std", "preset"] }
fontdb = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11-dl = "2.21"
x11rb = { version = "0.13", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
