name: Release

# Push a tag like `v0.2.0` to build all platforms and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

  # Create a GitHub release.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # check if a dash is in the tag

  # Upload assets to the GitHub release.
  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # older glibc = runs on more distros
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: universal-apple-darwin # Apple Silicon + Intel
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: spacemonger
          target: ${{ matrix.target }}
          archive: spacemonger-$tag-$target
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
