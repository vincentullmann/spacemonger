name: Release

# Push a tag like `v0.2.0` to build all platforms and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64, ext: .exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--locked --release"
      - name: Rename binary
        shell: bash
        run: mv target/${{ matrix.target }}/release/spacemonger${{ matrix.ext }} spacemonger-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.ext }}
      - uses: softprops/action-gh-release@v2
        with:
          files: spacemonger-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.ext }}
